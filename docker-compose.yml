services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lotto_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
    networks:
      - lotto_net

  webserver:
    image: nginx:alpine
    container_name: lotto_nginx
    restart: unless-stopped
    ports:
      - "4040:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - lotto_net

  db:
    image: mysql:8.0
    container_name: lotto_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lotto_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_USER: ${DB_USERNAME:-lotto_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lotto_pass}
    ports:
      - "3306:3306"
    volumes:
      - lotto_mysql_data:/var/lib/mysql
    networks:
      - lotto_net

  node:
    image: node:20-alpine
    container_name: lotto_node
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    networks:
      - lotto_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lotto_phpmyadmin
    restart: unless-stopped
    ports:
      - "4041:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-lotto_user}
      PMA_PASSWORD: ${DB_PASSWORD:-lotto_pass}
      UPLOAD_LIMIT: 64M
    depends_on:
      - db
    networks:
      - lotto_net

networks:
  lotto_net:
    driver: bridge

volumes:
  lotto_mysql_data:
